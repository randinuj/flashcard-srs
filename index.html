    <script>
        // Global state
        let currentStudySession = [];
        let currentCardIndex = 0;
        let sessionStats = { correct: 0, total: 0 };

        // Wait for Firebase to load
        function waitForFirebase() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.db && window.firebaseFunctions) {
                        resolve();
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        }

        // Navigation
        function showPage(pageName) {
            document.querySelectorAll('.page-content').forEach(page => page.classList.add('hidden'));
            document.getElementById(`page-${pageName}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300 px-3 py-2 rounded-md text-sm font-medium border-b-2 border-transparent';
            });
            document.getElementById(`nav-${pageName}`).className = 'nav-btn text-primary border-primary dark:text-blue-400 dark:border-blue-400 px-3 py-2 rounded-md text-sm font-medium border-b-2';

            if (pageName === 'dashboard') {
                loadDashboard();
            } else if (pageName === 'study') {
                resetStudySession();
            }
        }

        // Firestore functions
        async function getDueCards() {
            try {
                await waitForFirebase();
                const { collection, getDocs, query, where } = window.firebaseFunctions;
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const cardsQuery = query(
                    collection(db, 'flashcards'),
                    where('dueDate', '<=', today)
                );

                const querySnapshot = await getDocs(cardsQuery);
                const cards = [];

                querySnapshot.forEach((doc) => {
                    const card = doc.data();
                    card.id = doc.id;
                    cards.push(card);
                });

                return cards;
            } catch (error) {
                console.error('Error getting due cards:', error);
                showError('Failed to load cards. Using demo data instead.');
                
                // Return demo data if Firebase fails
                return getDemoCards();
            }
        }

        function getDemoCards() {
            return [
                {
                    id: 'demo-1',
                    question: 'What is the law of demand?',
                    answer: 'As price increases, quantity demanded decreases',
                    subject: 'economics',
                    type: 'basic',
                    dueDate: new Date()
                },
                {
                    id: 'demo-2',
                    question: 'What is the accounting equation?',
                    answer: 'Assets = Liabilities + Equity',
                    subject: 'accounting', 
                    type: 'basic',
                    dueDate: new Date()
                },
                {
                    id: 'demo-3',
                    question: 'What does CPU stand for?',
                    answer: 'Central Processing Unit',
                    subject: 'ict',
                    type: 'basic',
                    dueDate: new Date()
                }
            ];
        }

        async function saveCard(card) {
            try {
                await waitForFirebase();
                const { collection, addDoc } = window.firebaseFunctions;
                
                const cardData = {
                    question: card.question,
                    answer: card.answer,
                    type: card.type,
                    subject: card.subject,
                    options: card.options || [],
                    correctIndex: card.correctIndex || 0,
                    easeFactor: card.easeFactor || 2.5,
                    interval: card.interval || 0,
                    reviews: card.reviews || 0,
                    dueDate: card.dueDate || new Date(),
                    createdAt: new Date(),
                    lastReviewed: null
                };

                await addDoc(collection(db, 'flashcards'), cardData);
                return true;
            } catch (error) {
                console.error('Error saving card:', error);
                showError('Failed to save card to database.');
                return false;
            }
        }

        async function updateCard(cardId, updates) {
            try {
                await waitForFirebase();
                const { doc, updateDoc } = window.firebaseFunctions;
                
                const cardRef = doc(db, 'flashcards', cardId);
                await updateDoc(cardRef, updates);
                return true;
            } catch (error) {
                console.error('Error updating card:', error);
                return false;
            }
        }

        // SM-2 Algorithm
        function updateCardSM2(card, grade) {
            card.easeFactor = card.easeFactor || 2.5;
            card.interval = card.interval || 0;
            card.reviews = card.reviews || 0;
            
            if (grade >= 3) {
                if (card.reviews === 0) {
                    card.interval = 1;
                } else if (card.reviews === 1) {
                    card.interval = 6;
                } else {
                    card.interval = Math.round(card.interval * card.easeFactor);
                }
                
                card.easeFactor = card.easeFactor + (0.1 - (5 - grade) * (0.08 + (5 - grade) * 0.02));
                card.easeFactor = Math.max(1.3, card.easeFactor);
            } else {
                card.interval = 1;
            }
            
            card.reviews = card.reviews + 1;
            card.lastReviewed = new Date();
            
            const nextReview = new Date();
            nextReview.setDate(nextReview.getDate() + card.interval);
            card.nextReview = nextReview;
            
            return card;
        }

        async function submitAnswer(grade) {
            const card = currentStudySession[currentCardIndex];
            
            try {
                const updatedCard = updateCardSM2(card, grade);
                
                await updateCard(card.id, {
                    easeFactor: updatedCard.easeFactor,
                    interval: updatedCard.interval,
                    reviews: updatedCard.reviews,
                    dueDate: updatedCard.nextReview,
                    lastReviewed: new Date()
                });
                
                sessionStats.total++;
                if (grade >= 3) {
                    sessionStats.correct++;
                }
                
                currentCardIndex++;
                showCurrentCard();
            } catch (error) {
                console.error('Error submitting answer:', error);
                // Continue anyway with demo mode
                sessionStats.total++;
                if (grade >= 3) sessionStats.correct++;
                currentCardIndex++;
                showCurrentCard();
            }
        }

        // Dashboard functions
        async function loadDashboard() {
            try {
                const dueCards = await getDueCards();
                document.getElementById('cards-due-count').textContent = dueCards.length;

                // Update subject counts
                const econCards = dueCards.filter(c => c.subject === 'economics');
                const accCards = dueCards.filter(c => c.subject === 'accounting');
                const ictCards = dueCards.filter(c => c.subject === 'ict');

                document.getElementById('econ-due').textContent = econCards.length;
                document.getElementById('econ-due-text').textContent = econCards.length;
                document.getElementById('acc-due').textContent = accCards.length;
                document.getElementById('acc-due-text').textContent = accCards.length;
                document.getElementById('ict-due').textContent = ictCards.length;
                document.getElementById('ict-due-text').textContent = ictCards.length;

                // Update start study button
                const startBtn = document.getElementById('start-study-btn');
                if (dueCards.length === 0) {
                    startBtn.textContent = 'No Cards Due';
                    startBtn.disabled = true;
                    startBtn.className = 'bg-gray-400 text-white font-bold py-3 px-8 rounded-lg text-lg cursor-not-allowed';
                } else {
                    startBtn.textContent = `Start Study Session (${dueCards.length} cards)`;
                    startBtn.disabled = false;
                    startBtn.className = 'bg-primary hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-200 transform hover:scale-105 shadow-lg';
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showError('Failed to load dashboard data');
            }
        }

        // Study session functions
        async function startStudySession(subject) {
            showPage('study');
            try {
                currentStudySession = await getDueCards();
                
                if (subject) {
                    currentStudySession = currentStudySession.filter(card => card.subject === subject);
                }
                
                if (currentStudySession.length === 0) {
                    showNoCards();
                    return;
                }
                
                currentCardIndex = 0;
                sessionStats = { correct: 0, total: 0 };
                showCurrentCard();
            } catch (error) {
                console.error('Error starting study session:', error);
                showError('Failed to load study cards');
            }
        }

        function showCurrentCard() {
            if (currentCardIndex >= currentStudySession.length) {
                showSessionComplete();
                return;
            }

            const card = currentStudySession[currentCardIndex];

            document.getElementById('current-question').textContent = card.question;
            document.getElementById('current-answer').textContent = card.answer;

            // Update progress
            document.getElementById('session-progress').textContent = `${currentCardIndex + 1} / ${currentStudySession.length}`;
            const progressPercent = ((currentCardIndex + 1) / currentStudySession.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Update subject badge
            const subjectBadge = document.getElementById('subject-badge');
            subjectBadge.textContent = card.subject.charAt(0).toUpperCase() + card.subject.slice(1);
            subjectBadge.className = `inline-block px-3 py-1 rounded-full text-xs font-medium mb-4 bg-${card.subject} text-white`;

            // Handle MCQ options
            const mcqContainer = document.getElementById('mcq-options');
            mcqContainer.innerHTML = '';

            if (card.type === 'mcq' && card.options) {
                card.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.className = 'block w-full text-left p-3 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition duration-200';
                    button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                    button.onclick = () => selectMCQOption(index);
                    mcqContainer.appendChild(button);
                });
            }

            document.getElementById('question-display').classList.remove('hidden');
            document.getElementById('reveal-btn-container').classList.remove('hidden');
            document.getElementById('answer-display').classList.add('hidden');
            document.getElementById('no-cards-message').classList.add('hidden');
        }

        function revealAnswer() {
            document.getElementById('reveal-btn-container').classList.add('hidden');
            document.getElementById('answer-display').classList.remove('hidden');
        }

        function selectMCQOption(selectedIndex) {
            const card = currentStudySession[currentCardIndex];
            const isCorrect = selectedIndex === card.correctIndex;
            const grade = isCorrect ? 4 : 2;
            
            submitAnswer(grade);
        }

        function showSessionComplete() {
            const accuracy = sessionStats.total > 0 ? Math.round((sessionStats.correct / sessionStats.total) * 100) : 0;
            document.getElementById('session-stats').textContent =
                `Completed ${sessionStats.total} cards with ${accuracy}% accuracy`;

            document.getElementById('question-display').classList.add('hidden');
            document.getElementById('session-complete').classList.remove('hidden');
        }

        function resetStudySession() {
            currentStudySession = [];
            currentCardIndex = 0;
            sessionStats = { correct: 0, total: 0 };
            document.getElementById('no-cards-message').classList.remove('hidden');
            document.getElementById('question-display').classList.add('hidden');
            document.getElementById('session-complete').classList.add('hidden');
        }

        function showNoCards() {
            document.getElementById('no-cards-message').classList.remove('hidden');
            document.getElementById('question-display').classList.add('hidden');
        }

        // Import functions
        function previewCards() {
            const text = document.getElementById('import-textarea').value;
            const subject = document.getElementById('subject-select').value;
            const autoMCQ = document.getElementById('auto-mcq').checked;

            try {
                const cards = parseInput(text, subject, autoMCQ);
                displayPreview(cards);
            } catch (error) {
                showError('Failed to parse cards. Check the format.');
            }
        }

        function parseInput(text, subject, autoMCQ) {
            const lines = text.split('\n').filter(line => line.trim());
            const cards = [];
            let currentCard = null;

            for (const line of lines) {
                if (line.includes('\t')) {
                    const [question, answer] = line.split('\t').map(part => part.trim());
                    if (question && answer) {
                        cards.push({
                            question,
                            answer,
                            type: 'basic',
                            subject
                        });
                    }
                    continue;
                }

                if (line.toLowerCase().startsWith('q:')) {
                    if (currentCard) cards.push(currentCard);
                    currentCard = {
                        question: line.substring(2).trim(),
                        type: 'basic',
                        subject
                    };
                } else if (line.toLowerCase().startsWith('a:')) {
                    if (currentCard) {
                        currentCard.answer = line.substring(2).trim();
                    }
                } else if ((line.startsWith('-') || line.startsWith('*')) && autoMCQ) {
                    if (currentCard) {
                        if (!currentCard.options) {
                            currentCard.options = [];
                            currentCard.type = 'mcq';
                        }

                        const optionText = line.substring(1).trim();
                        const isCorrect = line.includes('(correct)') || line.includes('(right)');

                        currentCard.options.push(optionText.replace('(correct)', '').replace('(right)', '').trim());

                        if (isCorrect) {
                            currentCard.correctIndex = currentCard.options.length - 1;
                        }
                    }
                } else if (currentCard && !currentCard.answer) {
                    currentCard.answer = line.trim();
                } else if (!currentCard && line.trim()) {
                    if (currentCard) cards.push(currentCard);
                    currentCard = {
                        question: line.trim(),
                        type: 'basic',
                        subject
                    };
                }
            }

            if (currentCard) cards.push(currentCard);

            cards.forEach(card => {
                if (card.type === 'mcq' && card.options && card.correctIndex === undefined) {
                    card.correctIndex = 0;
                }
            });

            return cards;
        }

        function displayPreview(cards) {
            const previewArea = document.getElementById('preview-area');
            const previewStats = document.getElementById('preview-stats');
            const previewCards = document.getElementById('preview-cards');

            previewStats.textContent = `Found ${cards.length} card(s)`;
            previewCards.innerHTML = '';

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'bg-gray-50 dark:bg-gray-700 p-4 rounded-lg';

                let content = `
                    <div class="font-semibold text-gray-900 dark:text-white">Q: ${card.question}</div>
                    <div class="mt-2 text-gray-700 dark:text-gray-300">A: ${card.answer}</div>
                `;

                if (card.type === 'mcq' && card.options) {
                    content += `<div class="mt-2 text-sm text-gray-600 dark:text-gray-400">Options: ${card.options.join(', ')}</div>`;
                    content += `<div class="mt-1 text-sm text-green-600 dark:text-green-400">Correct: ${card.options[card.correctIndex]}</div>`;
                }

                cardElement.innerHTML = content;
                previewCards.appendChild(cardElement);
            });

            previewArea.classList.remove('hidden');
        }

        async function importCards() {
            const text = document.getElementById('import-textarea').value;
            const subject = document.getElementById('subject-select').value;
            const autoMCQ = document.getElementById('auto-mcq').checked;
            const statusElement = document.getElementById('import-status');

            try {
                const cards = parseInput(text, subject, autoMCQ);
                let successCount = 0;

                for (const card of cards) {
                    if (await saveCard(card)) {
                        successCount++;
                    }
                }

                statusElement.className = 'bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 p-4 rounded-md';
                statusElement.innerHTML = `
                    <strong>Success!</strong> Imported ${successCount} out of ${cards.length} cards.
                `;
                statusElement.classList.remove('hidden');

                document.getElementById('import-textarea').value = '';
                document.getElementById('preview-area').classList.add('hidden');

                loadDashboard();
            } catch (error) {
                console.error('Error importing cards:', error);
                statusElement.className = 'bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 p-4 rounded-md';
                statusElement.innerHTML = `
                    <strong>Error!</strong> Failed to import cards. Please check the format.
                `;
                statusElement.classList.remove('hidden');
            }
        }

        // Utility functions
        function showError(message) {
            alert(`Error: ${message}`);
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            showPage('dashboard');
            loadDashboard();
        });
    </script>

    <style>
        .nav-btn {
            @apply px-3 py-2 rounded-md text-sm font-medium border-b-2 border-transparent transition duration-200;
        }
    </style>
</body>
